<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track Your Order — The Royal Cafe &amp; Coffee</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Mukta:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --charcoal:#1E1815; --orange:#C6491F; --gold:#F2A93B; --gold-soft:#F8D9A0;
    --cream:#FBF1E4; --paper:#FFFBF5; --ink:#241D18; --ink-soft:#6E6157; --line:#ECE0CF;
    --done:#2E7D32;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--cream);color:var(--ink);font-family:'Mukta',sans-serif;min-height:100vh;}
  header{background:var(--charcoal);color:var(--gold-soft);padding:22px 20px;text-align:center;}
  header h1{font-family:'Fraunces',serif;font-size:20px;margin:0;font-weight:600;}
  header .sub{font-size:12.5px;color:#C9BBA0;margin-top:4px;}
  .wrap{max-width:480px;margin:0 auto;padding:20px 18px 40px;}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:22px 18px;}
  .order-id{text-align:center;font-size:13px;color:var(--ink-soft);}
  .order-id strong{color:var(--ink);font-size:15px;}
  .payment-note{
    text-align:center;font-size:12.5px;font-weight:700;color:var(--orange);
    background:rgba(198,73,31,.1);border-radius:999px;padding:6px 14px;
    display:table;margin:10px auto 0;
  }
  .payment-note.paid{color:var(--done);background:rgba(46,125,50,.12);}
  .steps{margin:26px 0 8px;}
  .step{display:flex;gap:14px;position:relative;padding-bottom:30px;}
  .step:last-child{padding-bottom:0;}
  .step-marker{
    width:28px;height:28px;border-radius:50%;flex:none;
    display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:700;border:2px solid var(--line);color:var(--ink-soft);
    background:#fff;z-index:1;
  }
  .step.done .step-marker{background:var(--done);border-color:var(--done);color:#fff;}
  .step.current .step-marker{background:var(--orange);border-color:var(--orange);color:#fff;}
  .step-line{
    position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--line);
  }
  .step.done .step-line{background:var(--done);}
  .step-label{padding-top:3px;}
  .step-label .name{font-weight:700;font-size:14.5px;}
  .step.current .step-label .name{color:var(--orange);}
  .step.done .step-label .name{color:var(--done);}
  .step-label .desc{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .details{margin-top:22px;padding-top:18px;border-top:1px dashed var(--line);}
  .details .items{font-size:13.5px;color:var(--ink);white-space:pre-line;line-height:1.6;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px;}
  .details .total{display:flex;justify-content:space-between;margin-top:12px;font-weight:700;font-size:16px;color:var(--orange);}
  .refresh-hint{text-align:center;font-size:12px;color:var(--ink-soft);margin-top:16px;}
  .state-msg{text-align:center;color:var(--ink-soft);padding:40px 10px;font-size:14.5px;line-height:1.6;}
  .call-btn{
    display:block;text-align:center;margin-top:16px;background:var(--gold);color:var(--charcoal);
    text-decoration:none;font-weight:700;padding:12px;border-radius:10px;font-size:14px;
  }
</style>
</head>
<body>

<header>
  <h1>The Royal Cafe &amp; Coffee</h1>
  <div class="sub">Order tracking</div>
</header>

<div class="wrap">
  <div class="card" id="card">
    <div class="state-msg">Loading your order…</div>
  </div>
</div>

<script>
/* ============================================================
   CONFIG — same Web App URL as owner-dashboard.html.
   ============================================================ */
const DASHBOARD_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyuYCw6EkSBmFILEDslEOqHXRCpgcG_pq2CLrZtRgwuiyK4BKh7h6dztn0jKZ3hYsrvJw/exec'; // e.g. 'https://script.google.com/macros/s/AKfycb.../exec'
const POLL_INTERVAL_MS = 8000;

const DELIVERY_STAGES = [
  { key:'Order Placed', name:'Order placed', desc:'We\u2019ve received your order.' },
  { key:'Accepted', name:'Accepted', desc:'The kitchen has confirmed your order.' },
  { key:'Preparing', name:'Preparing', desc:'Your food is being cooked fresh.' },
  { key:'Out for Delivery', name:'Out for delivery', desc:'On its way to you.' },
  { key:'Delivered', name:'Delivered', desc:'Enjoy your meal!' },
];
const PICKUP_STAGES = [
  { key:'Order Placed', name:'Order placed', desc:'We\u2019ve received your order.' },
  { key:'Accepted', name:'Accepted', desc:'The kitchen has confirmed your order.' },
  { key:'Preparing', name:'Preparing', desc:'Your food is being cooked fresh.' },
  { key:'Ready for Pickup', name:'Ready for pickup', desc:'Come collect it at the counter.' },
  { key:'Completed', name:'Completed', desc:'Thanks for ordering with us!' },
];

function getOrderIdFromUrl(){
  const params = new URLSearchParams(window.location.search);
  return params.get('id') || params.get('order') || '';
}

function renderSteps(order){
  const stages = /delivery/i.test(order.orderType) ? DELIVERY_STAGES : PICKUP_STAGES;
  const currentIdx = stages.findIndex(function(s){ return s.key === order.status; });
  const idx = currentIdx === -1 ? 0 : currentIdx;

  const stepsHtml = stages.map(function(s, i){
    const cls = i < idx ? 'done' : (i === idx ? 'current' : '');
    const marker = i < idx ? '✓' : (i+1);
    const showLine = i < stages.length - 1;
    return `
      <div class="step ${cls}">
        ${showLine ? '<div class="step-line"></div>' : ''}
        <div class="step-marker">${marker}</div>
        <div class="step-label">
          <div class="name">${s.name}</div>
          <div class="desc">${s.desc}</div>
        </div>
      </div>
    `;
  }).join('');

  document.getElementById('card').innerHTML = `
    <div class="order-id">Order <strong>#${order.orderId}</strong></div>
    <div class="payment-note ${String(order.payment).toLowerCase()==='paid' ? 'paid' : ''}">
      ${String(order.payment).toLowerCase()==='paid' ? '✓ Payment confirmed' : 'Payment pending confirmation'}
    </div>
    <div class="steps">${stepsHtml}</div>
    <div class="details">
      <div class="items">${order.items || ''}</div>
      <div class="total"><span>Total</span><span>₹${order.total || 0}</span></div>
    </div>
    <a class="call-btn" href="tel:+919200211339">Call the cafe</a>
    <div class="refresh-hint">This page updates automatically — no need to refresh.</div>
  `;
}

function loadStatus(){
  const orderId = getOrderIdFromUrl();
  if(!orderId){
    document.getElementById('card').innerHTML = '<div class="state-msg">No order ID found in this link. Please use the tracking link sent to you after placing your order.</div>';
    return;
  }
  if(!DASHBOARD_SCRIPT_URL){
    document.getElementById('card').innerHTML = '<div class="state-msg">Order tracking isn\'t set up yet. Please check WhatsApp for your order confirmation.</div>';
    return;
  }
  fetch(DASHBOARD_SCRIPT_URL + '?track=' + encodeURIComponent(orderId))
    .then(function(res){ return res.json(); })
    .then(function(data){
      if(!data.found){
        document.getElementById('card').innerHTML = '<div class="state-msg">We couldn\'t find this order yet. If you just placed it, please wait a few seconds and this page will update automatically.</div>';
        return;
      }
      renderSteps(data);
    })
    .catch(function(){
      document.getElementById('card').innerHTML = '<div class="state-msg">Couldn\'t check your order status right now — please check your connection.</div>';
    });
}

loadStatus();
setInterval(loadStatus, POLL_INTERVAL_MS);
</script>
</body>
</html>
